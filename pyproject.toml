[project]
name = "tradingstudy"
version = "0.1.0"
description = "MCB and divergence trading system discovery"
requires-python = ">=3.13,<3.14"
dependencies = [
    "pandas",
    "numpy",
    "pyarrow",
    "numba>=0.68.1",
]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tradingstudy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
